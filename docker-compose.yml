services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sakshi
      POSTGRES_PASSWORD: sakshi
      POSTGRES_DB: sakshi
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakshi"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6390:6379"]
volumes:
  pgdata:
