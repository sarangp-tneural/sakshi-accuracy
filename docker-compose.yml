services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sakshi
      POSTGRES_PASSWORD: sakshi
      POSTGRES_DB: sakshi
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakshi"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6390:6379"]
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    # local only: the control API accepts camera links (with passwords), so it must never be reachable from outside
    ports: ["127.0.0.1:8554:8554", "127.0.0.1:9997:9997"]
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
volumes:
  pgdata:
