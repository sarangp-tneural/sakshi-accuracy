services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sakshi
      POSTGRES_PASSWORD: sakshi
      POSTGRES_DB: sakshi
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakshi"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6390:6379"]
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports: ["8554:8554"]
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    environment:
      MTX_PATHS_CAM1_SOURCE: ${CAMERA1_RTSP_URL}
volumes:
  pgdata:
